short_bio: >-
  <p>
    I am currently a <strong>Ph.D. candidate in Statistics and Data Science</strong> at the
    <a href="https://www.stat.nus.edu.sg/" target="_blank"
       rel="noopener noreferrer">National University of Singapore</a>.
    My research interests include causal inference, differential privacy, 
    high-dimensional statistics, network analysis, and personalized decision-making. My work is closely 
    connected to modern data science and artificial intelligence, 
    with applications in business and management, medicine, and sociology.
  </p>

