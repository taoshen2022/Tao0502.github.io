short_bio: >-

<p>
  I am currently a <strong>Ph.D. candidate in Statistics</strong> at the
  <a href="https://www.stat.nus.edu.sg/" target="_blank">
    National University of Singapore</a>. My research interests cover
  personalized decision-making, statistical network analysis,
  differential privacy, high-dimensional statistics,
  and causal inference. My work is motivated by applications in precision
  medicine, social networks, policy learning, and data-driven decision-making,
  and is closely connected to modern developments in artificial intelligence
  and reinforcement learning.
</p>

