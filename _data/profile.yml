short_bio: >-
  <p>
    I am currently a <strong>Ph.D. candidate in Statistics</strong> at the
    <a href="https://www.stat.nus.edu.sg/" target="_blank"
       rel="noopener noreferrer">National University of Singapore</a>.
    My research interests include personalized decision-making,
    statistical network analysis, differential privacy,
    high-dimensional statistics, and causal inference. My work is closely 
    connected to modern data science and artificial intelligence, 
    with applications in medicine, social networks, and business management.
  </p>

